name: Build the OpenFlux core

# Builds the OpenFlux exit from a reviewed upstream commit and, when asked, publishes it as the release
# core-<version>-<n> of this repository. The plugin pins the release's hashes in core.go; the panel downloads
# the file from the release and refuses it unless the hash matches. Run by hand only.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream tag, for example v0.13.0"
        required: true
        type: string
      commit:
        description: "The full SHA of the commit that tag points at (the one that was reviewed)"
        required: true
        type: string
      publish:
        description: "Publish the release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: core
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      COMMIT: ${{ inputs.commit }}
      PUBLISH: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: Test the plugin
        run: go test -count=1 ./...
      - name: Build both architectures from the commit
        run: scripts/build-core.sh "$VERSION" "$COMMIT" out
      - name: Check the static binaries
        run: |
          set -euo pipefail
          for a in amd64 arm64; do file "out/openflux-linux-$a" | grep -q "statically linked"; done
          cat out/*.sha256
      - name: Release
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          prefix="core-${VERSION}-"
          last=$(gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
            | awk -v p="$prefix" 'index($0, p) == 1 { n = substr($0, length(p) + 1); if (n ~ /^[0-9]+$/ && n + 0 > max) max = n + 0 } END { print max + 0 }')
          release="${prefix}$((last + 1))"
          {
            echo "OpenFlux ${VERSION}, built for the Better OpenFlux plugin."
            echo
            echo "Not a standalone install: the plugin makes the panel download this file and check its hash."
            echo
            echo "- amd64: \`$(cat out/openflux-linux-amd64.sha256)\`"
            echo "- arm64: \`$(cat out/openflux-linux-arm64.sha256)\`"
            echo
            echo "Source: https://github.com/p1neappleXpress/OpenFlux/tree/${COMMIT} (tag ${VERSION}), built unchanged by scripts/build-core.sh of https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA} (CGO off, -trimpath). OpenFlux is GPL-3.0-or-later software of its authors."
          } > notes.md
          gh release create "$release" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false --title "$release" --notes-file notes.md \
            out/openflux-linux-amd64 out/openflux-linux-arm64
          echo "published $release"
